image: node:20

cache:
  paths:
    - node_modules/
    - .pnpm-store/

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm config set store-dir .pnpm-store

pages:
  stage: deploy
  script:
    - pnpm install --frozen-lockfile
    - pnpm build:prod
    - mkdir -p public
    - cp -r build/client/* public/
    - echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/b/flash"></head><body>Redirecting to /b/flash...</body></html>' > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
